{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h1>Register</h1>
  <p class="sub">Invite-code registration keeps bad actors out</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Username</label>
    <input name="username" required autofocus>
    <label>Email</label>
    <input name="email" type="email">
    <label>Password</label>
    <input name="password" type="password" required>
    <label>Invite code (optional)</label>
    <input name="invitecode" placeholder="Enter an invite code for a bonus">
    {% if ref %}<input type="hidden" name="ref" value="{{ ref }}">{% endif %}
    <button class="btn" style="width:100%">Register</button>
  </form>
  <p style="margin-top:14px;font-size:13px;color:var(--muted);text-align:center">
    Already have an account? <a href="{{ url_for('web.login') }}">Sign in</a>
  </p>
</div>
{% endblock %}
