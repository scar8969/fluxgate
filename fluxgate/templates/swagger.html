{% extends 'base.html' %}
{% block content %}
<h1>Swagger UI</h1>
<p class="sub">Interactive API explorer — try endpoints directly.</p>
<div id="swagger-ui"></div>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
<script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
<script>
window.onload = () => {
  window.ui = SwaggerUIBundle({
    url: '/api/openapi.json',
    dom_id: '#swagger-ui',
    deepLinking: true,
  });
};
</script>
<style>#swagger-ui { background: var(--card); border-radius: 12px; padding: 10px; }</style>
{% endblock %}
