{% extends 'base.html' %}
{% block content %}
<div class="card" style="max-width:420px;margin:40px auto;">
  <h1>Sign in</h1>
  <p class="sub">Welcome back — enter your credentials</p>
  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label>Username</label>
    <input name="username" required autofocus>
    <label>Password</label>
    <input name="password" type="password" required>
    {% if need_2fa %}
    <label>2FA code (authenticator app)</label>
    <input name="totp" inputmode="numeric" pattern="[0-9]{6}" placeholder="000000" required autofocus>
    {% endif %}
    <button class="btn" style="width:100%">Sign in</button>
  </form>
  <p style="margin-top:14px;font-size:13px;color:var(--muted);text-align:center">
    No account? <a href="{{ url_for('web.register') }}">Register</a> · Demo <b>demo / demo123</b> · Admin <b>admin / admin123</b>
  </p>
</div>
{% endblock %}
