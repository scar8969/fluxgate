[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxgate"
version = "0.7.0"
description = "Self-hosted proxy management panel — users, nodes, subscriptions, billing in one process."
readme = "README.md"
license = { text = "GPL-3.0" }
requires-python = ">=3.10"
dependencies = [
    "flask>=3.0",
    "flask-sqlalchemy>=3.1",
    "qrcode>=7.4",
    "pillow>=10.0",
]

[project.scripts]
fluxgate = "run:app"

[tool.setuptools]
packages = ["fluxgate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
