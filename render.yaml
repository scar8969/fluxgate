services:
  - type: web
    name: fluxgate
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "fluxgate:create_app()" --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: HOST
        value: https://fluxgate.onrender.com
